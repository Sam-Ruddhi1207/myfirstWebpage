<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Internship Portal</title>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #f5f7fb;
    color: #222;
}

section {
    scroll-margin-top: 80px;
}


/* =========================
   NAVBAR
========================= */

.navbar {
    background: linear-gradient(135deg, #4338ca, #7c3aed);
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

.nav-container {
    max-width: 1400px;
    margin: auto;
    min-height: 75px;
    padding: 0 30px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    color: white;
    text-decoration: none;
    font-size: 24px;
    font-weight: bold;
}

.nav-menu {
    list-style: none;

    display: flex;
    align-items: center;

    gap: 4px;
}

.nav-menu li a {
    color: white;
    text-decoration: none;

    padding: 10px 11px;

    border-radius: 7px;

    font-size: 13px;

    transition: 0.3s;
}

.nav-menu li a:hover {
    background: rgba(255,255,255,0.15);
    color: #ffd700;
}

.login-btn {
    background: white !important;
    color: #4338ca !important;
    font-weight: bold;
}

.menu-toggle {
    display: none;

    background: transparent;
    border: none;

    color: white;

    font-size: 28px;

    cursor: pointer;
}


/* =========================
   HERO
========================= */

.hero {
    min-height: 520px;

    background:
        linear-gradient(
            135deg,
            #4f46e5,
            #7c3aed
        );

    color: white;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 60px 20px;
}

.hero h1 {
    font-size: 52px;
    margin-bottom: 20px;
}

.hero p {
    max-width: 800px;

    font-size: 19px;

    margin-bottom: 30px;
}

.hero-btn {
    display: inline-block;

    background: white;

    color: #4f46e5;

    text-decoration: none;

    padding: 14px 28px;

    border-radius: 8px;

    font-weight: bold;

    transition: 0.3s;
}

.hero-btn:hover {
    background: #ffd700;
    color: #222;
}


/* =========================
   SEARCH
========================= */

.search-section {
    background: white;

    text-align: center;

    padding: 40px 20px;
}

.search-section h2 {
    margin-bottom: 20px;
}

#searchBox {
    width: 70%;
    max-width: 650px;

    padding: 14px;

    border: 1px solid #ccc;

    border-radius: 8px;

    font-size: 16px;

    outline: none;
}


/* =========================
   COMMON
========================= */

.page-section {
    padding: 70px 8%;
}

.section-title {
    text-align: center;

    font-size: 34px;

    margin-bottom: 40px;
}


/* =========================
   INTERNSHIP CARDS
========================= */

.internship-grid {
    max-width: 1150px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 25px;
}

.internship-card {
    background: white;

    border-radius: 15px;

    padding: 25px;

    min-height: 350px;

    display: flex;
    flex-direction: column;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,0.08);

    border: 1px solid #e5e7eb;

    transition: 0.3s;
}

.internship-card:hover {
    transform: translateY(-6px);

    box-shadow:
        0 12px 30px
        rgba(0,0,0,0.14);
}

.internship-card h3 {
    color: #4338ca;

    margin-bottom: 12px;
}

.internship-card p {
    color: #555;

    margin: 5px 0;
}

.badge {
    display: inline-block;

    width: fit-content;

    margin-top: 12px;

    padding: 5px 10px;

    border-radius: 20px;

    background: #eef2ff;

    color: #4338ca;

    font-size: 12px;
}


/* =========================
   CARD BUTTONS
========================= */

.card-buttons {
    display: flex;

    gap: 10px;

    margin-top: auto;
}

.card-buttons button {
    flex: 1;
}

.apply-btn {
    padding: 12px;

    border: none;

    border-radius: 8px;

    background: #4f46e5;

    color: white;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}

.apply-btn:hover {
    background: #3730a3;
}

.details-btn {
    padding: 12px;

    border: 2px solid #4f46e5;

    border-radius: 8px;

    background: white;

    color: #4f46e5;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}

.details-btn:hover {
    background: #4f46e5;

    color: white;
}


/* =========================
   APPLY
========================= */

.apply-section {
    background: #eef2ff;

    padding: 70px 20px;
}

.form-container {
    max-width: 750px;

    margin: auto;

    background: white;

    padding: 35px;

    border-radius: 16px;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,0.08);
}

.form-container h2 {
    text-align: center;

    color: #4338ca;

    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;

    margin-bottom: 7px;

    font-weight: bold;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;

    padding: 13px;

    border: 1px solid #d1d5db;

    border-radius: 8px;

    outline: none;

    font-size: 15px;
}

.submit-btn {
    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 8px;

    background: #4f46e5;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

.submit-btn:hover {
    background: #3730a3;
}


/* =========================
   MY APPLICATIONS
========================= */

.applications-section {
    background: white;

    padding: 70px 8%;
}

.application-grid {
    max-width: 1100px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 25px;
}

.application-card {
    background: white;

    border: 1px solid #e5e7eb;

    border-radius: 15px;

    padding: 25px;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,0.07);
}

.application-card h3 {
    color: #4338ca;

    margin-bottom: 12px;
}

.application-card p {
    margin: 7px 0;

    color: #555;
}

.status {
    display: inline-block;

    margin-top: 10px;

    padding: 6px 13px;

    border-radius: 20px;

    font-size: 13px;

    font-weight: bold;
}

.status-pending {
    background: #fff7ed;
    color: #c2410c;
}

.status-approved {
    background: #ecfdf5;
    color: #047857;
}

.status-rejected {
    background: #fef2f2;
    color: #b91c1c;
}

.withdraw-btn {
    margin-top: 18px;

    padding: 10px 18px;

    border: none;

    border-radius: 7px;

    background: #dc2626;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

.withdraw-btn:hover {
    background: #b91c1c;
}

.empty-applications {
    grid-column: 1 / -1;

    text-align: center;

    padding: 35px;

    color: #777;

    background: #f8fafc;

    border-radius: 12px;
}


/* =========================
   ABOUT
========================= */

.about {
    padding: 70px 8%;

    text-align: center;
}

.about p {
    max-width: 850px;

    margin: auto;

    color: #555;

    line-height: 1.8;
}


/* =========================
   CONTACT
========================= */

.contact {
    background: white;

    padding: 70px 20px;

    text-align: center;
}

.contact-info p {
    margin: 15px;

    color: #555;
}


/* =========================
   LOGIN / REGISTER
========================= */

.auth-section {
    padding: 70px 20px;

    background: #eef2ff;
}

.auth-box {
    max-width: 600px;

    margin: auto;

    background: white;

    padding: 35px;

    border-radius: 16px;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,0.08);
}

.auth-box h2 {
    text-align: center;

    color: #4338ca;

    margin-bottom: 25px;
}


/* =========================
   PROFILE
========================= */

.profile-section {
    padding: 70px 20px;

    background: white;
}

.profile-card {
    max-width: 700px;

    margin: auto;

    background: white;

    padding: 35px;

    border-radius: 16px;

    text-align: center;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,0.08);
}

.profile-circle {
    width: 90px;
    height: 90px;

    margin: 0 auto 20px;

    border-radius: 50%;

    background: #4f46e5;

    color: white;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 35px;

    font-weight: bold;
}


/* =========================
   STUDENT DASHBOARD
========================= */

.dashboard-section {
    padding: 70px 8%;

    background: #f5f7fb;
}

.dashboard-grid {
    max-width: 1100px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 20px;
}

.dashboard-card {
    background: white;

    padding: 30px;

    border-radius: 15px;

    text-align: center;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,0.07);
}

.dashboard-card h3 {
    color: #4338ca;

    margin-bottom: 10px;
}

.dashboard-number {
    font-size: 35px;

    font-weight: bold;

    color: #4f46e5;
}


/* =====================================================
   ADMIN DASHBOARD
===================================================== */

.admin-section {
    padding: 70px 6%;

    background: #f8fafc;
}

.admin-header {
    max-width: 1200px;

    margin: auto;

    text-align: center;

    margin-bottom: 35px;
}

.admin-header h2 {
    font-size: 36px;

    color: #1e293b;

    margin-bottom: 10px;
}

.admin-header p {
    color: #64748b;
}

.admin-stats {
    max-width: 1200px;

    margin: 0 auto 30px;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 20px;
}

.admin-stat-card {
    background: white;

    border-radius: 15px;

    padding: 25px;

    display: flex;

    align-items: center;

    gap: 18px;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,0.06);

    border: 1px solid #e5e7eb;

    transition: 0.3s;
}

.admin-stat-card:hover {
    transform: translateY(-4px);

    box-shadow:
        0 10px 25px
        rgba(0,0,0,0.10);
}

.stat-icon {
    width: 55px;
    height: 55px;

    border-radius: 12px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 25px;

    background: #eef2ff;
}

.stat-info h3 {
    font-size: 28px;

    color: #1e293b;
}

.stat-info p {
    font-size: 13px;

    color: #64748b;
}

.admin-controls {
    max-width: 1200px;

    margin: 0 auto 20px;

    background: white;

    padding: 18px;

    border-radius: 12px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.05);
}

.admin-search {
    flex: 1;

    max-width: 450px;

    padding: 12px 15px;

    border: 1px solid #d1d5db;

    border-radius: 8px;

    outline: none;

    font-size: 14px;
}

.admin-search:focus {
    border-color: #4f46e5;
}

.status-filter {
    padding: 12px 15px;

    border: 1px solid #d1d5db;

    border-radius: 8px;

    background: white;

    outline: none;

    font-size: 14px;
}

.admin-table-container {
    max-width: 1200px;

    margin: auto;

    background: white;

    border-radius: 15px;

    padding: 20px;

    overflow-x: auto;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,0.06);
}

.admin-table {
    width: 100%;

    border-collapse: collapse;

    min-width: 1000px;
}

.admin-table th {
    background: #eef2ff;

    color: #4338ca;

    padding: 14px;

    text-align: left;

    font-size: 13px;
}

.admin-table td {
    padding: 13px;

    border-bottom: 1px solid #edf0f3;

    font-size: 13px;

    color: #475569;
}

.admin-table tr:hover {
    background: #fafafa;
}

.admin-status {
    display: inline-block;

    padding: 5px 10px;

    border-radius: 20px;

    font-size: 11px;

    font-weight: bold;
}

.admin-pending {
    background: #fff7ed;

    color: #c2410c;
}

.admin-approved {
    background: #ecfdf5;

    color: #047857;
}

.admin-rejected {
    background: #fef2f2;

    color: #b91c1c;
}

.admin-action-btn {
    border: none;

    padding: 7px 9px;

    border-radius: 6px;

    color: white;

    font-size: 11px;

    font-weight: bold;

    cursor: pointer;

    margin: 2px;
}

.approve-btn {
    background: #16a34a;
}

.approve-btn:hover {
    background: #15803d;
}

.reject-btn {
    background: #dc2626;
}

.reject-btn:hover {
    background: #b91c1c;
}

.delete-btn {
    background: #64748b;
}

.delete-btn:hover {
    background: #475569;
}


/* =====================================================
   INTERNSHIP DETAILS MODAL
===================================================== */

.details-modal {
    display: none;

    position: fixed;

    z-index: 2000;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background: rgba(15, 23, 42, 0.75);

    padding: 30px 15px;

    overflow-y: auto;
}

.details-modal.active {
    display: flex;

    align-items: center;

    justify-content: center;
}

.details-box {
    position: relative;

    width: 100%;

    max-width: 650px;

    background: white;

    border-radius: 18px;

    padding: 35px;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,0.25);

    animation: modalOpen 0.25s ease;
}

@keyframes modalOpen {

    from {
        opacity: 0;
        transform: translateY(-20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.close-details {
    position: absolute;

    right: 18px;
    top: 15px;

    width: 38px;
    height: 38px;

    border: none;

    border-radius: 50%;

    background: #f1f5f9;

    color: #334155;

    font-size: 25px;

    cursor: pointer;
}

.close-details:hover {
    background: #dc2626;

    color: white;
}

.details-box h2 {
    color: #4338ca;

    font-size: 27px;

    margin-bottom: 25px;

    padding-right: 40px;
}

.details-content p {
    margin: 13px 0;

    line-height: 1.6;

    color: #475569;
}

.details-content strong {
    color: #1e293b;
}

.details-content h3 {
    margin-top: 25px;

    margin-bottom: 8px;

    color: #4338ca;
}

.modal-apply-btn {
    width: 100%;

    margin-top: 25px;

    padding: 14px;

    border: none;

    border-radius: 9px;

    background: #4f46e5;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

.modal-apply-btn:hover {
    background: #3730a3;
}


/* =========================
   FOOTER
========================= */

footer {
    background: #222;

    color: white;

    text-align: center;

    padding: 25px;
}


/* =========================
   TABLET
========================= */

@media(max-width:1100px) {

    .nav-menu li a {
        font-size: 11px;

        padding: 8px 6px;
    }

    .internship-grid {
        grid-template-columns:
            repeat(2,1fr);
    }

    .dashboard-grid {
        grid-template-columns:
            repeat(2,1fr);
    }

    .admin-stats {
        grid-template-columns:
            repeat(2,1fr);
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:850px) {

    .menu-toggle {
        display: block;
    }

    .nav-menu {
        display: none;

        position: absolute;

        top: 75px;

        left: 0;
        right: 0;

        background:
            linear-gradient(
                135deg,
                #4338ca,
                #7c3aed
            );

        flex-direction: column;

        padding: 15px;

        gap: 4px;
    }

    .nav-menu.active {
        display: flex;
    }

    .nav-menu li a {
        display: block;

        text-align: center;

        padding: 12px;

        font-size: 14px;
    }

    .hero h1 {
        font-size: 38px;
    }

    .internship-grid {
        grid-template-columns: 1fr;
    }

    .application-grid {
        grid-template-columns: 1fr;
    }

    .dashboard-grid {
        grid-template-columns: 1fr;
    }

    .admin-stats {
        grid-template-columns: 1fr;
    }

    .admin-controls {
        flex-direction: column;

        align-items: stretch;
    }

    .admin-search {
        max-width: 100%;
    }

    .status-filter {
        width: 100%;
    }

}


/* =========================
   SMALL MOBILE
========================= */

@media(max-width:500px) {

    .logo {
        font-size: 20px;
    }

    .hero h1 {
        font-size: 30px;
    }

    .hero p {
        font-size: 16px;
    }

    #searchBox {
        width: 100%;
    }

    .form-container,
    .auth-box,
    .profile-card {
        padding: 22px;
    }

    .details-box {
        padding: 25px 20px;
    }

    .card-buttons {
        flex-direction: column;
    }

}


/* =====================================================
   STEP 11 - SEARCH & FILTERS
===================================================== */

.internship-filter-section {
    max-width: 1200px;
    margin: 0 auto 30px;
    padding: 28px;
    background: #ffffff;
    border-radius: 18px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 8px 25px rgba(0,0,0,0.07);
}

.filter-title {
    text-align: center;
    margin-bottom: 24px;
}

.filter-title h2 {
    color: #4338ca;
    margin-bottom: 8px;
}

.filter-title p {
    color: #64748b;
    font-size: 14px;
}

.internship-filters {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr auto;
    gap: 14px;
    align-items: end;
}

.filter-group {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.filter-group label {
    font-size: 13px;
    font-weight: 700;
    color: #334155;
}

.filter-group input,
.filter-group select {
    width: 100%;
    height: 44px;
    box-sizing: border-box;
    padding: 0 12px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    background: #ffffff;
    color: #1e293b;
    font-size: 14px;
    outline: none;
}

.filter-group input:focus,
.filter-group select:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
}

.clear-filter-btn {
    height: 44px;
    padding: 0 16px;
    border: none;
    border-radius: 9px;
    background: #ef4444;
    color: #ffffff;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
}

.clear-filter-btn:hover {
    background: #dc2626;
}

.filter-result-info {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid #e5e7eb;
    color: #64748b;
    font-size: 14px;
    font-weight: 600;
}

.internship-card.filter-hidden {
    display: none !important;
}

.no-filter-results {
    display: none;
    margin: 20px 0;
    padding: 35px 20px;
    text-align: center;
    background: #f8fafc;
    border-radius: 14px;
    color: #64748b;
}

.no-filter-results.show {
    display: block;
}

@media (max-width: 950px) {
    .internship-filters {
        grid-template-columns: 1fr 1fr;
    }

    .search-group {
        grid-column: 1 / -1;
    }

    .clear-filter-btn {
        width: 100%;
    }
}

@media (max-width: 600px) {
    .internship-filter-section {
        padding: 20px;
    }

    .internship-filters {
        grid-template-columns: 1fr;
    }

    .search-group {
        grid-column: auto;
    }
}

   /* =====================================================
   STEP 13 - ADMIN APPLICATION MANAGEMENT
===================================================== */

.admin-application-management {
    margin-top: 30px;
    padding: 28px;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.06);
}

.admin-section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.admin-section-header h2 {
    color: #4338ca;
    margin-bottom: 6px;
}

.admin-section-header p {
    color: #64748b;
    font-size: 14px;
}

.refresh-applications-btn {
    border: none;
    border-radius: 9px;
    padding: 11px 17px;
    bac
